<mat-toolbar color="primary">
  <button mat-icon-button (click)="toggleSidenav()">
    <mat-icon>menu</mat-icon>
  </button>
  <span>MaterialUI</span>
  <span class="spacer"></span>
</mat-toolbar>

<mat-sidenav-container class="dashboard-container">
  <mat-sidenav #sidenav mode="side" opened>
    <mat-list role="list">
  <mat-list-item role="listitem" ><mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="home"></mat-icon> Dashboard</mat-list-item><mat-divider />
  <mat-list-item role="listitem"><mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="settings"></mat-icon >Settings</mat-list-item><mat-divider />
  <mat-list-item role="listitem"><mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="logout"></mat-icon>Logout</mat-list-item><mat-divider />
</mat-list>
    
  </mat-sidenav>

  <mat-sidenav-content>
    <div class="dashboard-content">
      <mat-card>
        <h2>Welcome!</h2>
        <p>This is a simple dashboard using Angular Material.</p>
      </mat-card>

      <div class="table-section">
        <h3>Data Table</h3>
        <table mat-table [dataSource]="data" class="mat-elevation-z2">
          <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef>No.</th>
            <td mat-cell *matCellDef="let element">{{ element.position }}</td>
          </ng-container>

          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Name</th>
            <td mat-cell *matCellDef="let element">{{ element.name }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columns"></tr>
          <tr mat-row *matRowDef="let row; columns: columns;"></tr>
        </table>
      </div>

      <button mat-raised-button color="accent" (click)="openDialog()">Open Dialog</button>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
<ng-template #dialogTemplate>
  <h2 mat-dialog-title>Hello</h2>
  <mat-dialog-content>
    <p>This is a simple dialog box!</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Close</button>
  </mat-dialog-actions>
</ng-template>
