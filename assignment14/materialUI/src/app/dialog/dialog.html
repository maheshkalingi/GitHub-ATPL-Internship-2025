<div class="main">
    <form id="userForm" [formGroup]="userForm" (ngSubmit)="openSnackBar()" >
        <h1> Login </h1>
        <div class="inputs">
            <mat-form-field >
                <mat-label>Name</mat-label>
                <input type="text" matInput placeholder="Enter Name" formControlName="name">
                <mat-error *ngIf="userForm.controls['name'].errors?.['required'] && userForm.controls['name'].touched">Name is required</mat-error>
            </mat-form-field>
            <mat-form-field >
                <mat-label >Emial</mat-label>
                <input matInput placeholder="Enter Email" formControlName="email">
                <mat-error *ngIf="userForm.controls['email'].errors?.['required'] && userForm.controls['email'].touched">Email is required</mat-error>
                <mat-error *ngIf="userForm.controls['email'].errors?.['email']">Email is not Valid</mat-error>
            </mat-form-field>
            <mat-form-field>
                <mat-label>Phone Number</mat-label>
                <input matInput placeholder="Enter Phone Number" formControlName="phone">
                <mat-error *ngIf="userForm.controls['phone'].errors?.['required'] && userForm.controls['phone'].touched">Phone Number is required</mat-error>
                <mat-error *ngIf="userForm.controls['phone'].errors?.['min']">Phone number Exactly 10 digits</mat-error>
            </mat-form-field>
            <button matButton [disabled]="userForm.invalid">Submit</button>
        </div>
    </form>
</div>
