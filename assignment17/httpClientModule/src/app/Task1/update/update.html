<div class="main">
    <div class="inner">
    <form [formGroup]="updateUserForm" (ngSubmit)="onSubmit()">
        <h2>update User</h2>
        <label>ID:</label><br>
        <input type="number" placeholder="enter your Id" formControlName="id"/><br><br>
       <label>UserName:</label><br>
        <input type="text" placeholder="enter your name" formControlName="name"/><br><br>
        <label>Email:</label><br>
        <input type="email" placeholder="enter your email" formControlName="email"/><br><br>
       <button type="submit">Submit</button>
       <button (click)="onCancel()">Cancel</button>
    </form></div>
</div>
