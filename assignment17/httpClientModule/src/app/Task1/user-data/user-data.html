
<div class="container"><table>
    <thead>
<tr>
    <th>
        ID
    </th>
    <th>Name</th>
    <th>EMail</th>
    <th>Delete</th>
    <th>Update</th>
</tr>
    </thead>
    <tbody>
        <tr *ngFor="let data of api_data">
            <td>{{data.id}}</td>
            <td>{{data.name}}</td>
            <td>{{data.email}}</td>
            <td><button  (click)="onDelete(data.id)">Delete</button></td>
            <td><button id="upda" (click)="onUpdate(data.id)">Update</button></td>
        </tr>
        <button  id="addbtn" (click)="addNewUser()">Add User</button>
    </tbody>
</table><br><br>

</div>
