
<div class="container"><table>
    <thead>
<tr>
    <th>
        ID
    </th>
    <th>Name</th>
    <th>EMail</th>
    <th>Delete</th>
</tr>
    </thead>
    <tbody>
        <tr *ngFor="let data of api_data">
            <td>{{data.id}}</td>
            <td>{{data.name}}</td>
            <td>{{data.email}}</td>
            <td><button (click)="onDelete(data.id)">Delete</button></td>
        </tr>
    </tbody>
</table>
<button (click)="addNewUser()">Add User</button>
</div>
