<div class="container">
<h2>Login</h2>
    <form (ngSubmit)="onLogin()">
        <label>UserName:</label><br>
      <input [(ngModel)]="username" name="username" placeholder="Username" required /><br>
       <label>Password:</label><br>
      <input [(ngModel)]="password" name="password" type="password" placeholder="Password" required /><br><br>
      <button type="submit">Login</button>
    </form>
    </div>
