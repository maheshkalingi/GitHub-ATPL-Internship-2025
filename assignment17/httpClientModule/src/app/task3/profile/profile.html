<div class="container">
    <div class="inner">
    <h2>User Profile</h2>
    <app-error *ngIf="errorMessage" [message]="errorMessage"></app-error>

    <div *ngIf="user && !errorMessage">
      <p><strong>Name:</strong> {{ user.name }}</p>
      <p><strong>Age:</strong> {{ user.age }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
    </div></div>
</div>
