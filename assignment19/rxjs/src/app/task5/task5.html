<div class="container">
<button nz-button nzType="primary" (click)="openModal()">Open Modal</button>

<nz-modal
  [(nzVisible)]="isModalVisible"
  nzTitle="NG-ZORRO Modal"
  (nzOnOpen)="onModalOpen()"
  (nzOnClose)="onModalClose()"
  (nzAfterClose)="onAfterClose()"
  [nzFooter]="modalFooter"
>
  <p>This is the modal content.</p>
</nz-modal>

<ng-template #modalFooter>
  <button nz-button (click)="closeModal()">Close</button>
</ng-template>
</div>
