<div class="container">
<div [ngClass]="theme$ | async">
  <div class="container">
    <nz-button-group>
      <button
        nz-button
        [nzType]="(theme$ | async) === 'light' ? 'primary' : 'default'"
        (click)="setTheme('light')"
      >
        Light
      </button>
      <button
        nz-button
        [nzType]="(theme$ | async) === 'dark' ? 'primary' : 'default'"
        (click)="setTheme('dark')"
      >
        Dark
      </button>
    </nz-button-group>

    <div class="content-box">
      <h2>Theme Preview</h2>
      <p>The current theme is <strong>{{ theme$ | async }}</strong>.</p>
    </div>
  </div>
</div>
</div>
