<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card </title>
    <style>
        .container{
        display:flex;
        justify-content: center;
        align-items: center;
        }
    .card{
        border:1px solid black;
        text-align: center;
        max-width:250px;
        border-radius:10px;
        padding:5px 50px 5px 50px;
        margin:20px;

}
       button{
        background-color: green;
        color:white;
        border-radius:5px;
        padding:5px;
        border:none;
        cursor:pointer;
       }
       button:hover{
        background-color: blue;
       }
       
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
        <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?q=80&w=2080&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Shoe Image" style="width:60px ">
        <h3>Nike Shoes</h3>
        <p class="price">$19.99</p>
        <p><button >Buy Now</button></p>
    </div>
        
    </div>
</body>
</html>
