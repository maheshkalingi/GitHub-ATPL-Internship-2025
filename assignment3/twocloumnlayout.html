<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwoColoumn</title>
    <style>
        .container{
            display:flex;
        }
        .left{
            width:30%;
            background-color:red;
            padding:20px;
            border:1px solid black;

        }
        .right{
             width:70%;
             background-color:green;
             padding:20px;
             border:1px solid black;
             
        }
    </style>
</head>
<body>
    <h2>Two Coloumn Layout</h2>
    <div class="container">
       <div class="left">
        <h2>Left Content</h2>
        <p>this is the side bar Content</p>
       </div>
       <div class="right">
        <h2>Main Content</h2>
        <p>This is the SideBar Content</p>
        
       </div>
    </div>
</body>
</html>
