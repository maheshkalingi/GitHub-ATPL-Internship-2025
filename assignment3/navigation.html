<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Bar</title>
    <style>
       
        ul{
            list-style-type: none;
            margin: 0px;
            padding: 0px;
            background-color:black; 
            overflow:hidden;

            
        }
        li{
            display:inline;
            float:left;
           
        }
        li a{
            padding:15px 15px;
            text-decoration: none;
            background-color:black;
            color:white;
            width:60px;
            display:block;

        }
        li a:hover {
  background-color:red;
}
    </style>
</head>
<body>
    <div class="container">
        <div class="navb">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Product</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
       </div>
    </div>
</body>
</html>
