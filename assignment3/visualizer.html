<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Box Model Visualizer</title>
  <style>
    body {
      background: #eee;
      text-align: center;
      padding: 20px;
    }

    h2 {
      margin-top: 40px;
    }

    .box-wrapper {
      display: flex;
      justify-content: center;
      gap: 50px;
      margin-top: 40px;
    }

    .container {
      background-color: green; 
      padding: 20px;
    }

    .box {
      width: 200px;
      height: 100px;
      padding: 20px;
      border: 10px solid navy;
      background-color: lightgreen;
      color: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .content-box {
      box-sizing: content-box;
    }

    .border-box {
      box-sizing: border-box;
    }

    
  </style>
</head>
<body>

  <h1>Box Model Visualizer</h1>

  <div class="box-wrapper">
        <div class="container">
            <div class="box content-box">
                Content-Box
            </div>
       
    </div>

    <div class="container">
      <div class="box border-box">
        Border-Box
      </div>
   
    </div>
  </div>

</body>
</html>
