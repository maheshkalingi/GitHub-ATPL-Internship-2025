<!DOCTYPE html>
<html>
<head>
   <title>registration form</title>
</head>
<body>
      <h3>Student Registration Form</h3>
  <form  action="" method="">
    <label for="fname">First Name</label>
    <input type="text" placeholder="enter your first name" required><br><br>
    <label for="lname">Last Name</label>
    <input type="text" placeholder="enter your last name" required><br><br>
    <label for="email">Email</label>
    <input type="text" placeholder="enter your email" required><br><br>
    <label for="dob">Date of Birth</label>
    <input type="date" required><br><br>
    <label for="username"> Set Username</label>
    <input type="text" placeholder="set username" required><br><br>
    <label for="password">Set Password</label>
    <input type="password" placeholder="set Pasword" required><br><br>
    <label for="gender">Gender</label><br><br>
    <input type="radio" name="check" required>
    <label for="male">Male</label><br>
    <input type="radio" name="check"required>
    <label for="female">Female</label><br>
    <input type="radio" name="check" required>
    <label for="others">Others</label><br><br>
  <label for="course">Course :</label>
    <select>
      <option value="course">Course</option>
      <option value="html">HTML</option>
      <option value="css">CSS</option>
      <option value="js">JS</option>
   </select><br><br>
<label for="age">Age</label>
<input type="number" min="18" max="100" required><br><br>
<input type="submit" value="Submit">



   
</body>
</html>
