<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Even or Odd</title>
  <style>
    body {
      font-family: Arial, sans-serif;
     padding:0;
     margin:0;
     display:flex;
     align-items: center;
      justify-content: center;
      height:100vh;

    }
    input, button {
      padding: 10px;
      font-size: 16px;
      margin-right: 10px;
    }
    .mid{
      background-color:skyblue;
      width:fit-content;
      display:flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:30px;
      margin:15px;
      border-radius:10px;
    }
.mid h2{
  color:green;
  background-color:lightslategrey;
  color:white;
  padding:5px;
  border-radius: 5px;

}
.mid button{
  background-color:black;
  color:white;
  border-radius: 5px;
}
  </style>
</head>
<body>
<div class="mid">
  <h2>Even or Odd Checker</h2>
 
  <input type="number" id="userNumber" placeholder="Enter a number"><br>
  <button onclick="checkEvenOdd()">Check</button>
</div>
  <div id="output"></div>
</div>
  <script>
    function checkEvenOdd() {
      const num = parseInt(document.getElementById('userNumber').value);
      let message;
      if (isNaN(num)) {
         alert('Please enter a valid number.');
      } else {
        message = (num % 2 === 0) ? `${num} is Even` : `${num} is Odd`;
      }

      document.getElementById('output').textContent = alert(message);
    }
  </script>

</body>
</html>
