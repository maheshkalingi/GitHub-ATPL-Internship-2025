<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess Number</title>
    <style>
        body{
            padding:0;
            margin:0;
            display:flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width:100%;
            height:100vh;
             
        }
        .guesscontainer{
            background-color:black;
            color:white;
            display: flex;
            align-items: center;
            justify-content: center;
            width:fit-content;
            padding:15px;
            border-radius:10px;
            margin:10px;
        }
        .guesscontainer input,button{
            padding:5px;
            margin:10px;
        }
        .guesscontainer button{
            background-color: green;
            color:white;
            outline:none;
            padding:5px;
            width:70px;
            border-radius: 5px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="guesscontainer">
        <label for="enum" >Enter the Number:</label>
        <input type="number" id="inputNumber">
        <button type="submit " id="guessSubmit" onClick="myFunction()" >Guess</button><br><br>
    </div>
    <div class="answer"><h2 id="ans"></h2></div>
    <script>
        let randNumber=Math.floor((Math.random()*99+1));
       
       function myFunction(){
        let text="";
        let guessNumber=document.getElementById("inputNumber").value;
        if(guessNumber == randNumber){ 
           text+="You Got It.";
        }else if(guessNumber < randNumber){
            text+="You are Too Low.";
        }else if(guessNumber > randNumber){
            text+="You are Too High.";
        }
        document.getElementById("ans").textContent=text;
       }


    </script>
</body>
</html>
