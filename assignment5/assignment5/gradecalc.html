<!DOCTYPE html>
<html>
<head>
  <title>Grade Calculator</title>
  <style>
    body{
      padding:0;
      margin:0;
      box-sizing:border-box;
      display:flex;
      justify-content: center;
      align-items: center;
      height:100vh;

    }
.grading{
  background-color:lightseagreen;
  width:fit-content;
  display:flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding:20px;
  margin:10px;
  border-radius: 10px;
  
}
.grading button{
  background-color: mediumslateblue;
  color:white;
  border-radius: 5px;
  outline:none;
}
  </style>
</head>
<body>
<div class="grading">
  <h2>Grade Calculator</h2>
  <input id="m1" type="number" placeholder="Subject 1"><br><br>
  <input id="m2" type="number" placeholder="Subject 2"><br><br>
  <input id="m3" type="number" placeholder="Subject 3"><br><br>
  <input id="m4" type="number" placeholder="Subject 4"><br><br>
  <input id="m5" type="number" placeholder="Subject 5"><br><br>

  <button onclick="gradeCal()">Calculate Grade</button>

  <h3 id="output"></h3>
</div>
  <script>
    function gradeCal() {
      let m1 = Number(document.getElementById("m1").value);
      let m2 = Number(document.getElementById("m2").value);
      let m3 = Number(document.getElementById("m3").value);
      let m4 = Number(document.getElementById("m4").value);
      let m5 = Number(document.getElementById("m5").value);

      let total = m1 + m2 + m3 + m4 + m5;
      let average = total / 5;

      let grade = "";
      let color = "green";

      if (average >= 90) {
        grade = "A";
      } else if (average >= 75) {
        grade = "B";
      } else if (average >= 60) {
        grade = "C";
      } else if (average >= 40) {
        grade = "D";
      } else {
        grade = "F";
        color = "red";
      }

      document.getElementById("output").style.color = color;
      document.getElementById("output").innerHTML =
        "Total: " + total + "<br>Average: " + average.toFixed(2) + "<br>Grade: " + grade;
    }
  </script>

</body>
</html>
