<div class="main">
    <div class="inner">
        <h2>FeedBack Form</h2>
     <form #userForm="ngForm">
        <label>Full Name:</label><br>
        <input type="text" placeholder="Enter your full Name" name="fullName" required #uname="ngModel"  [(ngModel)]="userObj.fullName" autocomplete="off">
        <div class="error">
            @if(uname.errors?.['required'] && uname.touched){
                <span>Full Name is Required.</span>
            }
        </div>

        <label >FeedBack Type:<br>
        <input type="radio" name="feed"  required value="Good" [(ngModel)]="userObj.feedBackType">Good<br>
        <input type="radio" name="feed" required value="Average" [(ngModel)]="userObj.feedBackType">Average<br>
        <input type="radio" name="feed" required value="Poor" [(ngModel)]="userObj.feedBackType">Poor
        </label><br>

        <label >Comments:</label><br>
        <textarea></textarea><br>
<button type="submit" (click)="onSave()" [disabled]="userForm.invalid">Submit</button>
     </form>

    </div>

    <div *ngIf="onClick">
        <h4>Thank You! You Got Selected For Feedback Type  {{userObj.feedBackType}}</h4>
    </div>
</div>
