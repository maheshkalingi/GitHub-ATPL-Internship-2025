<div class="main">
    <div class="inner">
        <h2>DropDown List</h2>
        <form #form="ngForm">
            <label>Name:</label><br>
            <input type="text" placeholder="Enter your Name"  #uname="ngModel" [(ngModel)]="name" name="UserName" required>
            <div class="error">
                @if(uname.errors?.['required'] && uname.touched){
                <span>Name is Required</span>
                }
            </div>
       
            <label>Country:</label>
            <select  name="Country"  #cou="ngModel" [(ngModel)]="country" required>
                <option   value="INDIA">INDIA</option>
                <option  value="USA">USA</option>
                <option  value="UK">UK</option>
            </select>
             <div class="error">
                @if(cou.errors?.['required'] && cou.touched){
                <span>Country  is Required</span>
                }
            </div>
       <button type="button" [disabled]="form.invalid" (click)="onSave()">Submit</button>
        </form>

    </div>
    <div *ngIf="isSubmit">
       <h3>User Name:{{name}}</h3>
       <h3>Country :{{country}}</h3>
    </div>
</div>
