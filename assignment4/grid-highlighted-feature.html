<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Highlighted Feature</title>
    <style>
        .container{
            display:grid;
            grid-template-columns: repeat(4, 1fr);
            text-align: center;
            padding:20px;
            row-gap: 10px;
            column-gap: 10px;
            background-color:lightskyblue


        }
        .feature-item{
           grid-column-start: 1;
           grid-column-end:3;
           background-color: darkgray;
           text-align: center;
           padding-top: 10px;
        }
        .item{
            background-color: lightgray;
            padding:10px;

        }

    </style>
</head>
<body>
    <div class="container">
        <div class="feature-item">Featured Item</div>
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
        <div class="item">Item 4</div>
    </div>
    
</body>
</html>
