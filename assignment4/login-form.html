<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centered Login Form</title>
    <style>
        .container{
            display:flex;
            justify-content: center;
            align-items: center;
            width:100%;
            height:100vh;
        }
        .centeredform{
            background-color: lightblue;
            padding:40px;
            border: 1px solid black;
            border-radius: 5px;    
        }
        input:focus{
            outline:none;
            border:none;
        }
        
        h2{
            text-align:center;
        }
        button[type="submit"]{
            width:100%;
            background-color: blue;
            color:white;
            border-radius:5px;
            border:none;
        }
       
    </style>
</head>
<body>
    <form action="#" method="post">
     <div class="container">
        <div class="centeredform">
        <h2>Login</h2>
        <input type="text" placeholder="User Name"  name="uname" required><br><br>
        <input type="password" placeholder="Password" name="upass" required><br><br>
        <button type="submit" >Sign In</button>
        </div>
        
    </div>
        
    </form>
    
</body>
</html>
