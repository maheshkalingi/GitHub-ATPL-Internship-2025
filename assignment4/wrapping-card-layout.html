<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wrapping Card layout</title>
    <style>
  .container{
    display:flex;
    background-color: black;
    flex-wrap:wrap;
    padding:20px;
    
  }
  .items{
    background-color: green;
    font-size:20px;
    width:500px;
    text-align:center;
    line-height:50px;
    margin:10px;
  }

    </style>
</head>
<body>
    <div class="container">
        <div class="items">Card 1</div>
        <div class="items">Card 2</div>
        <div class="items">Card 3</div>
        <div class="items">Card 4</div>
        <div class="items">Card 5</div>
        <div class="items">Card 6</div>
        <div class="items">Card 7</div>
        <div class="items">Card 8</div>
    </div>
    
</body>
</html>
