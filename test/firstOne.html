<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert</title>
    <style>
        button{
            background-color: blue;
            color:white;
            border-radius:10px;
            outline:none;
        }
    </style>
</head>
<body>
    <button onClick="showAlert()">Click Me</button>
    <script>
        function showAlert(){
         alert("Thanks for Clicking!");
        }
    </script>
</body>
</html>
