  <style>
    body {
      text-align: center;
      font-family: Arial;
       display: flex;
      justify-content: center;
      align-items: center;
      height:100vh;
    }
    h2{
      color:white;
    }

    img {
      width: 300px;
      height: 200px;
      border-radius: 10px;
      margin-bottom:30px;
    }

    button {
      font-size: 16px;
      padding: 10px 20px;
      margin: 30px;
      background-color: blue;
      color:white;
      border-radius:5px;
      outline:none;

    }
    .container{
      width:fit-content;
      background-color: black;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding:50px;
      border-radius: 10px;

      

    }
  </style>

    let index = 0;
    let timeHolder; 

    const imgElement = document.getElementById("sliderImage");
    function next() {
      index = (index + 1) % images.length;
      imgElement.src = images[index];
    }
    function previous() {
      index = (index - 1 + images.length) % images.length;
      imgElement.src = images[index];
    }

    function startAutoPlay() {
      timeHolder = setInterval(next, 2000);}

    function stopAutoPlay() {
      clearInterval(timeHolder);
    }

    imgElement.addEventListener("mouseout", startAutoPlay);
