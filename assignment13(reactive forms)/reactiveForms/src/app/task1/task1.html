<div class="main">
    <div class="inner">
    <form [formGroup]="userForm" (ngSubmit)="onSave()">
        <label>UserName:</label><br>
        <input type="text" placeholder="enter your name" formControlName="userName" autocomplete="off"/><br><br>
         <label>Email:</label><br>
        <input type="email" placeholder="enter your email" formControlName="userEmail" autocomplete="off"/><br><br>
         <label>Password:</label><br>
        <input type="password" placeholder="enter your password" formControlName="userPassword" autocomplete="off"/><br><br>
    <button type="submit" >Register</button>
    </form></div>
</div>
